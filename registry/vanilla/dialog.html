<button class="kit-button" type="button" data-kit-dialog-open="demo-dialog">Publish theme</button>
<dialog class="kit-dialog" id="demo-dialog" aria-labelledby="demo-dialog-title">
  <h2 id="demo-dialog-title">Publish this theme?</h2>
  <p>The current copy becomes the public handoff. The original kit is never changed, and you can restore it any time.</p>
  <footer>
    <button class="kit-button" type="button" data-variant="ghost" data-kit-dialog-close>Cancel</button>
    <button class="kit-button" type="button" data-kit-dialog-close>Publish</button>
  </footer>
</dialog>
