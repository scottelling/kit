<div class="kit-field">
  <label for="field-email">Email address</label>
  <input class="kit-input" id="field-email" type="email" placeholder="you@example.com" autocomplete="email" />
  <p class="kit-help">We only use this to send your receipt.</p>
</div>
<div class="kit-field" data-state="error">
  <label for="field-name">Full name</label>
  <input class="kit-input" id="field-name" type="text" aria-invalid="true" aria-describedby="field-name-error" />
  <p class="kit-help" id="field-name-error">Enter your name to continue.</p>
</div>
